name: macOS HK4E build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
      - name: Build prerequisites
        run: brew install mingw-w64 uv python@3.13
      - name: Build Global from tracked/public inputs
        run: ./build-macos.sh
      - name: Source and package checks
        run: |
          npm exec --yes --package=node@16.20.2 --package=pnpm@7.33.7 --call 'pnpm test && pnpm run precommit && node scripts/verify-macos-package.cjs build/hk4eos'
          python3 scripts/test-collect-hk4e-evidence.py
      - name: Build distinct China package
        run: YAAGL_CHANNEL_CLIENT=hk4ecn ./build-macos.sh
      - name: Verify China and preserve other channel frontend coverage
        run: |
          npm exec --yes --package=node@16.20.2 --package=pnpm@7.33.7 --call 'node scripts/verify-macos-package.cjs build/hk4ecn'
          for channel in bh3glb hkrpgcn hkrpgos napcn napos; do
            YAAGL_CHANNEL_CLIENT="$channel" npm exec --yes --package=node@16.20.2 --package=pnpm@7.33.7 --call "pnpm exec vite build --outDir build/frontend-$channel"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-local-apps
          path: build/hk4e*/
          retention-days: 7
